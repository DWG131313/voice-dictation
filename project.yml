# XcodeGen spec for the app bundle. The project it generates is not committed
# (`*.xcodeproj` is ignored): `scripts/run-dev.sh` regenerates it each build.
# All logic is in the Swift package at the root; the app target only hosts
# the SwiftUI scenes in App/.
name: VoiceDictation
options:
  bundleIdPrefix: com.danny
  deploymentTarget:
    macOS: "26.0"
packages:
  VoiceDictation:
    path: .
  # Updates (Task 26). Only the app target links it, so `swift build` and
  # `swift test` never fetch it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  VoiceDictation:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - App
    dependencies:
      - package: VoiceDictation
        product: VoiceDictationLib
      - package: VoiceDictation
        product: VoiceDictationUI
      - package: Sparkle
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleName: VoiceDictation
        CFBundleDisplayName: VoiceDictation
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # Menu bar only: no Dock icon until the window opens.
        LSUIElement: true
        NSMicrophoneUsageDescription: VoiceDictation needs microphone access to record your voice for transcription.
        NSSpeechRecognitionUsageDescription: VoiceDictation turns your speech into text on this Mac. Nothing is sent anywhere.
        # Sparkle (Task 26) checks for updates only when Danny chooses "Check
        # for Updates…": false means no automatic checks, and no prompt
        # asking about them.
        SUEnableAutomaticChecks: false
        # PLACEHOLDERS, both, until the first Sparkle release: docs/release.md
        # ("Sparkle") says what goes here. The feed's host never resolves
        # (.invalid). The key is shaped like a real one because Sparkle will
        # not start, and shows an alert at every launch, on a key that is not
        # 32 bytes of base64; no update can pass it. release.sh refuses to run
        # while either is still a placeholder.
        SUFeedURL: "https://placeholder.invalid/appcast.xml"
        SUPublicEDKey: "PLACEHOLDER+run+Sparkle+generate+keys+first="
    entitlements:
      path: App/VoiceDictation.entitlements
      properties:
        # Hardened runtime needs this to record. No sandbox.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: VoiceDictation
        PRODUCT_BUNDLE_IDENTIFIER: com.danny.VoiceDictation
        DEVELOPMENT_TEAM: F7DL4CTLLL
        ENABLE_HARDENED_RUNTIME: YES
        # The package's language mode.
        SWIFT_VERSION: "5.0"
        # App/Assets.xcassets, drawn by scripts/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
